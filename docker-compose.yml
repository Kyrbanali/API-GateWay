version: '3'

services:
  postgres:
    image: postgres:15
    container_name: pg
    environment:
      - POSTGRES_USER: postgres
      - POSTGRES_PASSWORD: postgres
      - POSTGRES_DB: postgres
    ports:
      -5432:5432
    volumes:
      -pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: api
    depends_on:
      - postgres
    ports:
      -3000:3000

volumes:
  pgdata: